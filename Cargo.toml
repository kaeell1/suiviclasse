[package]
name = "suiviclasse"
version = "0.1.0"
edition = "2021"
description = "Suivi de classe : plan de classe interactif, points, notes, saisie de séance et EDT"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
